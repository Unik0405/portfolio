<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nikhil Narendiran | Architecture Portfolio</title>
  <meta name="description" content="Selected architectural works by Nikhil Narendiran, presented as a book-style portfolio viewer." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- The cover is the first thing anyone sees; start fetching it immediately. -->
  <link rel="preload" as="image" href="pages/01.webp" />
</head>
<body>
  <main class="viewer">
    <div class="stage" id="stage">
      <div class="spread" id="spread">
        <img class="page" id="page-left" alt="" decoding="async" />
        <img class="page" id="page-right" alt="" decoding="async" />
      </div>
      <div class="spinner" id="spinner" aria-hidden="true"></div>
    </div>

    <header class="brand">
      <p class="eyebrow">Architecture Portfolio</p>
      <h1>Nikhil Narendiran</h1>
    </header>

    <button class="nav nav-prev" id="prev" type="button" aria-label="Previous pages"></button>
    <button class="nav nav-next" id="next" type="button" aria-label="Next pages"></button>

    <div class="hud">
      <span class="counter" id="status">Loading</span>
      <span class="hud-sep" aria-hidden="true"></span>
      <a class="hud-link" href="Nikhil-Narendiran-Portfolio.pdf" target="_blank" rel="noopener">Open PDF</a>
    </div>
  </main>

  <script>
    // Pages are pre-rendered to WebP at build time (see tools/render-pages.py).
    // Keep TOTAL in step with the files in pages/.
    const TOTAL = 41;
    const PAGE_W = 841.89;   // A3 portrait, in points
    const PAGE_H = 1190.55;
    const SMALL_SRC_WIDTH = 877;   // pixel width of the -sm variant

    const stage = document.getElementById("stage");
    const spread = document.getElementById("spread");
    const leftImg = document.getElementById("page-left");
    const rightImg = document.getElementById("page-right");
    const spinner = document.getElementById("spinner");
    const statusEl = document.getElementById("status");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");

    let spreadIndex = 0;
    let singlePage = 1;

    const singleView = () => window.matchMedia("(max-width: 900px)").matches;

    // Book layout: the cover sits alone on the right, then pages pair up.
    const leftPageOf = (i) => (i === 0 ? null : i * 2);
    const rightPageOf = (i) => (i === 0 ? 1 : i * 2 + 1);
    const maxSpread = () => Math.floor(TOTAL / 2);

    const minIndex = () => (singleView() ? 1 : 0);
    const maxIndex = () => (singleView() ? TOTAL : maxSpread());
    const currentIndex = () => (singleView() ? singlePage : spreadIndex);
    const setIndex = (v) => {
      const clamped = Math.max(minIndex(), Math.min(v, maxIndex()));
      if (singleView()) singlePage = clamped;
      else spreadIndex = clamped;
    };

    // Serve the half-size variant when that is all the display can resolve.
    const srcFor = (page, cssWidth) => {
      const needed = cssWidth * (window.devicePixelRatio || 1);
      const variant = needed <= SMALL_SRC_WIDTH ? "-sm" : "";
      return "pages/" + String(page).padStart(2, "0") + variant + ".webp";
    };

    const layout = () => {
      const single = singleView();
      spread.classList.toggle("single", single);
      const cols = single ? 1 : 2;
      const ratio = (cols * PAGE_W) / PAGE_H;
      const W = stage.clientWidth;
      const H = stage.clientHeight;
      // Contain: fit the height, fall back to the width on narrow windows.
      let h = H;
      let w = h * ratio;
      if (w > W) { w = W; h = w / ratio; }
      spread.style.width = Math.round(w) + "px";
      spread.style.height = Math.round(h) + "px";
      return w / cols;   // css width of one page
    };

    // Resolves once the bytes are in. Deliberately driven by the load event
    // rather than img.decode(): decode() only settles when the image is ready
    // to *paint*, so in a background or occluded tab it can hang indefinitely
    // on an image that has already fully loaded, which would leave the spinner
    // up and the controls dead.
    const whenReady = (img) => new Promise((resolve) => {
      if (img.complete && img.naturalWidth) {
        resolve();
        return;
      }
      const done = () => {
        img.removeEventListener("load", done);
        img.removeEventListener("error", done);
        resolve();
      };
      img.addEventListener("load", done);
      img.addEventListener("error", done);
    });

    const setPage = (img, page, cssWidth) => {
      if (!page || page > TOTAL) {
        img.removeAttribute("src");
        img.classList.add("is-blank");
        img.alt = "";
        return null;
      }
      img.classList.remove("is-blank");
      img.alt = "Portfolio page " + page;
      const src = srcFor(page, cssWidth);
      if (img.getAttribute("src") !== src) img.src = src;
      // Worth asking for an early decode, but never worth waiting on.
      if (img.decode) img.decode().catch(() => {});
      return whenReady(img);
    };

    const label = () => {
      if (singleView()) return "Page " + singlePage + " of " + TOTAL;
      const l = leftPageOf(spreadIndex);
      const r = Math.min(rightPageOf(spreadIndex), TOTAL);
      if (l === null) return "Page " + r + " of " + TOTAL;
      if (l >= TOTAL) return "Page " + TOTAL + " of " + TOTAL;
      return l === r ? "Page " + l + " of " + TOTAL
                     : "Pages " + l + "–" + r + " of " + TOTAL;
    };

    const preload = (cssWidth) => {
      const wanted = [];
      if (singleView()) {
        wanted.push(singlePage + 1, singlePage - 1);
      } else {
        [spreadIndex + 1, spreadIndex - 1].forEach((i) => {
          if (i >= 0 && i <= maxSpread()) wanted.push(leftPageOf(i), rightPageOf(i));
        });
      }
      wanted
        .filter((p) => p && p >= 1 && p <= TOTAL)
        .forEach((p) => { new Image().src = srcFor(p, cssWidth); });
    };

    let spinnerTimer = null;
    const render = async () => {
      const cssWidth = layout();
      // Only show the spinner if decoding is slow enough to be noticed.
      clearTimeout(spinnerTimer);
      spinnerTimer = setTimeout(() => spinner.classList.add("is-visible"), 180);

      const jobs = singleView()
        ? [setPage(leftImg, singlePage, cssWidth), setPage(rightImg, null, cssWidth)]
        : [setPage(leftImg, leftPageOf(spreadIndex), cssWidth),
           setPage(rightImg, rightPageOf(spreadIndex), cssWidth)];
      // A stalled or failed image must never wedge the controls, so cap the
      // wait and carry on regardless.
      await Promise.race([
        Promise.all(jobs.filter(Boolean)),
        new Promise((r) => setTimeout(r, 3000)),
      ]);

      clearTimeout(spinnerTimer);
      spinner.classList.remove("is-visible");
      statusEl.textContent = label();
      prevBtn.disabled = currentIndex() <= minIndex();
      nextBtn.disabled = currentIndex() >= maxIndex();
      preload(cssWidth);
    };

    const step = (delta) => { setIndex(currentIndex() + delta); render(); };

    prevBtn.addEventListener("click", () => step(-1));
    nextBtn.addEventListener("click", () => step(1));

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); step(1); }
      if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); step(-1); }
      if (e.key === "Home") { e.preventDefault(); setIndex(-Infinity); render(); }
      if (e.key === "End") { e.preventDefault(); setIndex(Infinity); render(); }
    });

    // Swipe on touch devices.
    let touchX = null;
    stage.addEventListener("touchstart", (e) => { touchX = e.changedTouches[0].clientX; }, { passive: true });
    stage.addEventListener("touchend", (e) => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
      touchX = null;
    }, { passive: true });

    let resizeTimer = null;
    let wasSingle = singleView();
    window.addEventListener("resize", () => {
      layout();   // keep the frame correct straight away
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const nowSingle = singleView();
        if (nowSingle !== wasSingle) {
          // Carry the reader's place across the mode switch.
          if (nowSingle) singlePage = Math.max(1, leftPageOf(spreadIndex) || 1);
          else spreadIndex = Math.floor(singlePage / 2);
          wasSingle = nowSingle;
        }
        render();
      }, 150);
    });

    render();
  </script>
</body>
</html>
