<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nikhil Narendiran | Architecture Portfolio</title>
  <meta name="description" content="Selected architectural works by Nikhil Narendiran, presented as a book-style portfolio viewer." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- The cover is the first thing anyone sees; start fetching it immediately. -->
  <link rel="preload" as="image" href="pages/01.webp" />
</head>
<body>
  <main class="viewer">
    <div class="stage" id="stage">
      <div class="spread" id="spread">
        <img class="page" id="page-left" alt="" decoding="async" />
        <img class="page" id="page-right" alt="" decoding="async" />

        <!-- The turning sheet. Its front is the page you are leaving and its
             back is the page you are turning to, hinged at the spine, exactly
             as the two sides of one leaf of paper. -->
        <div class="flip" id="flip" aria-hidden="true">
          <div class="flip-face flip-front">
            <img id="flip-front-img" alt="" decoding="async" />
            <div class="flip-shade" id="flip-front-shade"></div>
          </div>
          <div class="flip-face flip-back">
            <img id="flip-back-img" alt="" decoding="async" />
            <div class="flip-shade" id="flip-back-shade"></div>
          </div>
        </div>
      </div>
      <div class="spinner" id="spinner" aria-hidden="true"></div>
    </div>

    <!-- One reserved bar. Nothing floats over the page: at full height the
         page occupies the whole stage, so any overlay would sit on artwork. -->
    <header class="hud">
      <div class="hud-brand">
        <h1 class="hud-name">Nikhil Narendiran</h1>
        <p class="hud-eyebrow">Architecture Portfolio</p>
      </div>

      <div class="hud-controls">
        <button class="nav nav-prev" id="prev" type="button" aria-label="Previous pages"></button>
        <span class="counter" id="status">Loading</span>
        <button class="nav nav-next" id="next" type="button" aria-label="Next pages"></button>
        <span class="hud-sep" aria-hidden="true"></span>
        <a class="hud-link" href="Nikhil-Narendiran-Portfolio.pdf" target="_blank" rel="noopener">Open PDF</a>
      </div>
    </header>
  </main>

  <script>
    // Pages are pre-rendered to WebP at build time (see tools/render-pages.py).
    // Keep TOTAL in step with the files in pages/.
    const TOTAL = 41;
    const PAGE_W = 841.89;   // A3 portrait, in points
    const PAGE_H = 1190.55;
    const SPREAD_RATIO = (2 * PAGE_W) / PAGE_H;   // always two pages wide
    const SMALL_SRC_WIDTH = 877;   // pixel width of the -sm variant

    const stage = document.getElementById("stage");
    const spread = document.getElementById("spread");
    const leftImg = document.getElementById("page-left");
    const rightImg = document.getElementById("page-right");
    const spinner = document.getElementById("spinner");
    const statusEl = document.getElementById("status");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");

    let spreadIndex = 0;

    // Book layout: the cover sits alone on the right, then pages pair up.
    const leftPageOf = (i) => (i === 0 ? null : i * 2);
    const rightPageOf = (i) => (i === 0 ? 1 : i * 2 + 1);
    const maxSpread = () => Math.floor(TOTAL / 2);

    const setIndex = (v) => {
      spreadIndex = Math.max(0, Math.min(v, maxSpread()));
    };

    // Serve the half-size variant when that is all the display can resolve.
    const srcFor = (page, cssWidth) => {
      const needed = cssWidth * (window.devicePixelRatio || 1);
      const variant = needed <= SMALL_SRC_WIDTH ? "-sm" : "";
      return "pages/" + String(page).padStart(2, "0") + variant + ".webp";
    };

    const layout = () => {
      const W = stage.clientWidth;
      const H = stage.clientHeight;
      // Contain: fit the height, fall back to the width when the window is
      // narrower than the spread's fixed 1.41:1 shape.
      let h = H;
      let w = h * SPREAD_RATIO;
      if (w > W) { w = W; h = w / SPREAD_RATIO; }
      spread.style.width = Math.round(w) + "px";
      spread.style.height = Math.round(h) + "px";
      // Tie the vanishing point to the spread's own size, so the turn reads
      // identically on a phone and on a 27" display. Kept deliberately distant:
      // a nearer one balloons the leaf's near edge far outside the spread.
      spread.style.perspective = Math.round(w * 4) + "px";
      return w / 2;   // css width of one page
    };

    // Resolves once the bytes are in. Deliberately driven by the load event
    // rather than img.decode(): decode() only settles when the image is ready
    // to *paint*, so in a background or occluded tab it can hang indefinitely
    // on an image that has already fully loaded, which would leave the spinner
    // up and the controls dead.
    const whenReady = (img) => new Promise((resolve) => {
      if (img.complete && img.naturalWidth) {
        resolve();
        return;
      }
      const done = () => {
        img.removeEventListener("load", done);
        img.removeEventListener("error", done);
        resolve();
      };
      img.addEventListener("load", done);
      img.addEventListener("error", done);
    });

    const setPage = (img, page, cssWidth) => {
      if (!page || page > TOTAL) {
        img.removeAttribute("src");
        img.classList.add("is-blank");
        img.alt = "";
        return null;
      }
      img.classList.remove("is-blank");
      img.alt = "Portfolio page " + page;
      const src = srcFor(page, cssWidth);
      if (img.getAttribute("src") !== src) img.src = src;
      // Worth asking for an early decode, but never worth waiting on.
      if (img.decode) img.decode().catch(() => {});
      return whenReady(img);
    };

    const label = () => {
      const l = leftPageOf(spreadIndex);
      const r = Math.min(rightPageOf(spreadIndex), TOTAL);
      if (l === null) return "Page " + r + " of " + TOTAL;
      if (l >= TOTAL) return "Page " + TOTAL + " of " + TOTAL;
      return l === r ? "Page " + l + " of " + TOTAL
                     : "Pages " + l + "–" + r + " of " + TOTAL;
    };

    const preload = (cssWidth) => {
      [spreadIndex + 1, spreadIndex - 1]
        .filter((i) => i >= 0 && i <= maxSpread())
        .flatMap((i) => [leftPageOf(i), rightPageOf(i)])
        .filter((p) => p && p >= 1 && p <= TOTAL)
        .forEach((p) => { new Image().src = srcFor(p, cssWidth); });
    };

    let spinnerTimer = null;
    const render = async () => {
      const cssWidth = layout();
      // Only show the spinner if decoding is slow enough to be noticed.
      clearTimeout(spinnerTimer);
      spinnerTimer = setTimeout(() => spinner.classList.add("is-visible"), 180);

      const jobs = [
        setPage(leftImg, leftPageOf(spreadIndex), cssWidth),
        setPage(rightImg, rightPageOf(spreadIndex), cssWidth),
      ];
      // A stalled or failed image must never wedge the controls, so cap the
      // wait and carry on regardless.
      await Promise.race([
        Promise.all(jobs.filter(Boolean)),
        new Promise((r) => setTimeout(r, 3000)),
      ]);

      clearTimeout(spinnerTimer);
      spinner.classList.remove("is-visible");
      statusEl.textContent = label();
      prevBtn.disabled = spreadIndex <= 0;
      nextBtn.disabled = spreadIndex >= maxSpread();
      preload(cssWidth);
    };

    /* --- zoom and pan --------------------------------------------------
       A spread is fixed at 1.41:1, so on a phone each page lands around
       180x254. Zoom is what makes that readable. */

    const MAX_SCALE = 5;
    const TAP_ZOOM = 2.5;

    let scale = 1;
    let tx = 0;
    let ty = 0;

    const applyTransform = () => {
      spread.style.transform =
        scale === 1 ? "" : "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
      spread.classList.toggle("is-zoomed", scale > 1);
    };

    // The transform scales about the centre, so the box centre never moves;
    // the untransformed centre is therefore just the rect centre less the pan.
    const layoutCentre = () => {
      const r = spread.getBoundingClientRect();
      return { x: r.left + r.width / 2 - tx, y: r.top + r.height / 2 - ty };
    };

    // Keep the scaled spread covering its own box so it can never be panned
    // off into empty space.
    const clampPan = () => {
      const w = parseFloat(spread.style.width) || 0;
      const h = parseFloat(spread.style.height) || 0;
      const mx = Math.max(0, (w * (scale - 1)) / 2);
      const my = Math.max(0, (h * (scale - 1)) / 2);
      tx = Math.min(mx, Math.max(-mx, tx));
      ty = Math.min(my, Math.max(-my, ty));
    };

    // Once magnified past what the half-size file holds, fetch the full one.
    let resTimer = null;
    const ensureResolution = () => {
      clearTimeout(resTimer);
      resTimer = setTimeout(() => {
        const pageW = (parseFloat(spread.style.width) || 0) / 2;
        if (pageW * scale * (window.devicePixelRatio || 1) <= SMALL_SRC_WIDTH) return;
        [[leftImg, leftPageOf(spreadIndex)], [rightImg, rightPageOf(spreadIndex)]]
          .forEach(([img, page]) => {
            if (!page || page > TOTAL) return;
            const full = "pages/" + String(page).padStart(2, "0") + ".webp";
            if (img.getAttribute("src") === full) return;
            // Load it out of band and swap only once it is ready. Assigning
            // src directly clears the visible bitmap, so the reader would
            // watch the page blank out mid-zoom while the bigger file lands.
            const pre = new Image();
            pre.onload = () => { img.src = full; };
            pre.src = full;
          });
      }, 120);
    };

    // Zoom about a screen point, keeping whatever is under it in place.
    const zoomAbout = (px, py, next) => {
      const s2 = Math.min(MAX_SCALE, Math.max(1, next));
      const c = layoutCentre();
      tx = px - c.x - ((px - c.x - tx) / scale) * s2;
      ty = py - c.y - ((py - c.y - ty) / scale) * s2;
      scale = s2;
      if (scale === 1) { tx = 0; ty = 0; }
      clampPan();
      applyTransform();
      ensureResolution();
    };

    const resetZoom = () => {
      scale = 1;
      tx = 0;
      ty = 0;
      applyTransform();
    };

    const pointers = new Map();
    let pinchDist = 0;
    let panLast = null;
    let gestureStart = null;
    let lastTap = 0;

    stage.addEventListener("pointerdown", (e) => {
      // Register first: capture is only an optimisation for tracking a finger
      // that leaves the element, and it throws if the pointer is already gone.
      // Letting that throw would abort the handler and kill the gesture.
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { stage.setPointerCapture(e.pointerId); } catch (err) { /* best effort */ }
      if (pointers.size === 1) {
        panLast = { x: e.clientX, y: e.clientY };
        gestureStart = { x: e.clientX, y: e.clientY };
      } else if (pointers.size === 2) {
        gestureStart = null;   // a pinch is never a swipe
        const [a, b] = [...pointers.values()];
        pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
      }
    });

    stage.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size >= 2) {
        const [a, b] = [...pointers.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinchDist > 0) {
          zoomAbout((a.x + b.x) / 2, (a.y + b.y) / 2, scale * (dist / pinchDist));
        }
        pinchDist = dist;
      } else if (scale > 1 && panLast) {
        tx += e.clientX - panLast.x;
        ty += e.clientY - panLast.y;
        panLast = { x: e.clientX, y: e.clientY };
        clampPan();
        applyTransform();
      }
    });

    const endPointer = (e) => {
      if (!pointers.has(e.pointerId)) return;
      const start = gestureStart;
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinchDist = 0;
      if (pointers.size > 0) return;

      panLast = null;
      gestureStart = null;
      if (!start) return;

      const dx = e.clientX - start.x;
      const dy = e.clientY - start.y;

      // A short press is a tap; two in quick succession toggle zoom.
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
        const now = Date.now();
        if (now - lastTap < 300) {
          zoomAbout(e.clientX, e.clientY, scale > 1 ? 1 : TAP_ZOOM);
          lastTap = 0;
        } else {
          lastTap = now;
        }
        return;
      }

      // Swipe turns the page only at rest; while zoomed a drag is a pan.
      if (scale === 1 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        step(dx < 0 ? 1 : -1);
      }
    };

    stage.addEventListener("pointerup", endPointer);
    stage.addEventListener("pointercancel", endPointer);

    // Trackpad pinch arrives as ctrl+wheel.
    stage.addEventListener("wheel", (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      zoomAbout(e.clientX, e.clientY, scale * (1 - e.deltaY * 0.01));
    }, { passive: false });

    /* --- the page turn ---------------------------------------------------
       A leaf of paper carries two pages: turning forward, the right-hand page
       (2i+1) swings left about the spine and its back (2i+2) lands as the new
       left page. The newly uncovered half is filled in first, so it is already
       there as the leaf lifts off it. */

    const flipEl = document.getElementById("flip");
    const flipFrontImg = document.getElementById("flip-front-img");
    const flipBackImg = document.getElementById("flip-back-img");
    const flipFrontShade = document.getElementById("flip-front-shade");
    const flipBackShade = document.getElementById("flip-back-shade");

    const FLIP_MS = 620;
    const FLIP_EASE = "cubic-bezier(0.34, 0.02, 0.2, 1)";
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    let currentAnim = null;
    let flipDone = null;

    const setFace = (img, page, cssWidth) => {
      if (!page || page < 1 || page > TOTAL) {
        img.removeAttribute("src");
        img.style.visibility = "hidden";
        return null;
      }
      img.style.visibility = "";
      const src = srcFor(page, cssWidth);
      if (img.getAttribute("src") !== src) img.src = src;
      return whenReady(img);
    };

    const flipTo = async (target, forward, cssWidth) => {
      const frontPage = forward ? rightPageOf(spreadIndex) : leftPageOf(spreadIndex);
      const backPage = forward ? leftPageOf(target) : rightPageOf(target);
      const underImg = forward ? rightImg : leftImg;
      const underPage = forward ? rightPageOf(target) : leftPageOf(target);

      const jobs = [
        setFace(flipFrontImg, frontPage, cssWidth),
        setFace(flipBackImg, backPage, cssWidth),
        setPage(underImg, underPage, cssWidth),
      ].filter(Boolean);

      // A slow image must never stall the turn; it is preloaded in any case.
      await Promise.race([
        Promise.all(jobs),
        new Promise((r) => setTimeout(r, 400)),
      ]);

      flipEl.classList.remove("dir-next", "dir-prev");
      flipEl.classList.add(forward ? "dir-next" : "dir-prev", "is-active");
      stage.classList.add("is-turning");

      const opts = { duration: FLIP_MS, easing: FLIP_EASE, fill: "forwards" };
      const half = forward ? -90 : 90;
      const end = forward ? -180 : 180;
      // The dip counteracts the perspective bulge, which would otherwise push
      // the leaf's near edge past the top and bottom of the spread, and reads
      // as the page lifting away from the reader.
      const anim = flipEl.animate(
        [{ transform: "rotateY(0deg) scale(1)" },
         { transform: "rotateY(" + half + "deg) scale(0.93)", offset: 0.5 },
         { transform: "rotateY(" + end + "deg) scale(1)" }],
        opts
      );
      currentAnim = anim;

      // The leaf darkens as it turns edge-on to the light, and recovers as the
      // far side comes round.
      const shadeA = flipFrontShade.animate(
        [{ opacity: 0 }, { opacity: 0.32, offset: 0.55 }, { opacity: 0.4 }], opts);
      const shadeB = flipBackShade.animate(
        [{ opacity: 0.4 }, { opacity: 0.32, offset: 0.45 }, { opacity: 0 }], opts);

      // A backgrounded tab stops ticking animations, so `finished` can hang
      // indefinitely on a turn that will never advance. Cap the wait: the state
      // below is what actually matters, and the leaf is hidden either way.
      await Promise.race([
        anim.finished.catch(() => {}),
        new Promise((r) => setTimeout(r, FLIP_MS + 400)),
      ]);

      // Swap the real pages in behind the leaf, then take the leaf away, so
      // the change is never visible.
      spreadIndex = target;
      await render();
      flipEl.classList.remove("is-active");
      stage.classList.remove("is-turning");
      [anim, shadeA, shadeB].forEach((a) => a.cancel());
    };

    const step = async (delta) => {
      // Someone clicking faster than the turn shouldn't be made to wait: cut
      // the running one short and pick up from there. The target has to be
      // worked out *after* that settles — computing it up front would measure
      // from a stale index, so a burst of clicks would collapse onto the same
      // spread and animate turns that go nowhere.
      if (flipDone) {
        if (currentAnim) currentAnim.finish();
        try { await flipDone; } catch (err) { /* superseded */ }
      }

      const target = Math.max(0, Math.min(spreadIndex + delta, maxSpread()));
      if (target === spreadIndex) return;

      resetZoom();
      const cssWidth = layout();

      if (reduceMotion.matches) {
        setIndex(target);
        await render();
        return;
      }

      flipDone = flipTo(target, delta > 0, cssWidth);
      try {
        await flipDone;
      } finally {
        flipDone = null;
        currentAnim = null;
      }
    };

    // Home/End jump rather than turn; cancel any leaf mid-air first.
    const jumpTo = async (index) => {
      if (flipDone) {
        if (currentAnim) currentAnim.finish();
        try { await flipDone; } catch (err) { /* superseded */ }
      }
      resetZoom();
      setIndex(index);
      await render();
    };

    prevBtn.addEventListener("click", () => step(-1));
    nextBtn.addEventListener("click", () => step(1));

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); step(1); }
      if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); step(-1); }
      if (e.key === "Home") { e.preventDefault(); jumpTo(0); }
      if (e.key === "End") { e.preventDefault(); jumpTo(maxSpread()); }
      if (e.key === "Escape") { e.preventDefault(); resetZoom(); }
    });

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      resetZoom();   // the pan bounds belong to the old frame
      layout();      // keep the frame correct straight away
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 150);
    });

    render();
  </script>
</body>
</html>
